name: Publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
env:
  # site/astro.config.mjs and tests/check_site.py read these; a custom domain is a change to these two values
  W26_SITE_URL: https://poroprophet.lol
  W26_BASE: /
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install numpy scipy Pillow playwright
          python -m playwright install --with-deps chromium
      - name: Model tests
        run: python -X utf8 tests/test_v5.py
      - name: Export site assets
        run: python -X utf8 model/export_site_assets.py
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build site
        working-directory: site
        run: |
          npm ci
          npm run build
      - name: Site tests
        run: python -X utf8 tests/test_v5.py
      - name: Check site
        run: python -X utf8 tests/check_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="background: #15112A; border-bottom: 1px solid #3A3163; color: #EEEAF6; font-family: 'Spectral', serif; font-weight: 500">
  <div style="max-width: 1600px; margin: 0 auto; padding: 0 40px; display: flex; align-items: center; gap: 24px; min-height: 84px; flex-wrap: wrap">
    <a href="Home.dc.html" style="display: flex; align-items: center; gap: 14px; color: #EEEAF6; text-decoration: none">
      <img src="poroprophets/PoroMain.jpg" alt="Poro Prophet" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 2px #15112A, 0 0 0 3px #D9B45A">
      <span style="font-family: 'Cinzel', serif; font-weight: 700; font-size: 26px; letter-spacing: 0.05em">Poro Prophet</span>
    </a>
    <nav style="display: flex; gap: 2px; margin-left: auto; flex-wrap: wrap; white-space: nowrap; font-family: 'Cinzel', serif; font-weight: 600; font-size: 15px; letter-spacing: 0.08em">
      <sc-for list="{{items}}" as="n" hint-placeholder-count="8">
        <sc-if value="{{n.on}}" hint-placeholder-val="{{ false }}">
          <a href="{{n.href}}" style="padding: 8px 12px; color: #15112A; background: #D9B45A; border-radius: 3px; text-decoration: none">{{n.label}}</a>
        </sc-if>
        <sc-if value="{{n.off}}" hint-placeholder-val="{{ true }}">
          <a href="{{n.href}}" style="padding: 8px 12px; color: #E0DCEE; border-radius: 3px; text-decoration: none" style-hover="color: #D9B45A">{{n.label}}</a>
        </sc-if>
      </sc-for>
    </nav>
    <span style="font-size: 15px; font-weight: 600; color: #D9B45A; border: 1px solid #D9B45A; padding: 5px 12px; border-radius: 999px; white-space: nowrap">Swiss lock 24/10, 06:00 NZDT</span>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:84},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;play-in&quot;,&quot;swiss&quot;,&quot;knockouts&quot;,&quot;demacia-cup&quot;,&quot;teams&quot;,&quot;scorecard&quot;,&quot;meta&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'home';
    const nav = [['home','Home','Home'],['play-in','Play-In','Play-In'],['swiss','Swiss','Swiss'],['knockouts','Knockouts','Knockouts'],['demacia-cup','Demacia Cup','Demacia Cup'],['teams','Teams','Teams'],['scorecard','Scorecard','Scorecard'],['meta','Meta','Meta']];
    return { items: nav.map(([id, label, file]) => ({ label, href: file + '.dc.html', on: id === active, off: id !== active })) };
  }
}
</script>
</body>
</html>
